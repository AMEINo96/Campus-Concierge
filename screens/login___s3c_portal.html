<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NUSTCentral Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {"surface-container-low": "#f1f3fc", "surface-container": "#ebedf7", "surface-dim": "#d7dae3", error: "#ba1a1a", "secondary-fixed-dim": "#aec7f7", "secondary-container": "#b6d0ff", "on-primary-fixed": "#001b3e", "inverse-surface": "#2d3037", tertiary: "#9a4600", "on-primary-fixed-variant": "#00458d", "on-primary": "#ffffff", secondary: "#465f88", primary: "#005cb8", "on-surface-variant": "#414753", "on-secondary": "#ffffff", "tertiary-fixed-dim": "#ffb68c", "on-surface": "#181c22", "surface-bright": "#f9f9ff", "on-primary-container": "#000512", "surface-container-lowest": "#ffffff", "outline-variant": "#c1c6d5", "inverse-on-surface": "#eef0fa", "on-background": "#181c22", "surface-container-high": "#e6e8f1", background: "#f9f9ff", "on-tertiary": "#ffffff", "on-secondary-fixed": "#001b3d", "on-error": "#ffffff", "on-tertiary-fixed-variant": "#763400", "on-tertiary-fixed": "#321200", "tertiary-fixed": "#ffdbc9", "surface-variant": "#e0e2eb", "on-error-container": "#93000a", "tertiary-container": "#c05900", surface: "#f9f9ff", "secondary-fixed": "#d6e3ff", "primary-fixed": "#d6e3ff", "primary-fixed-dim": "#aac7ff", "on-secondary-container": "#3f5881", "error-container": "#ffdad6", "surface-tint": "#005db8", outline: "#717785", "on-secondary-fixed-variant": "#2d476f", "primary-container": "#1275e2", "inverse-primary": "#aac7ff", "surface-container-highest": "#e0e2eb", "on-tertiary-container": "#0d0300"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}, spacing: {"section-margin": "48px", "container-padding": "24px", "bento-gap": "16px", base: "8px", md: "16px", lg: "24px", xl: "32px", xs: "4px", sm: "8px", gutter: "16px", margin: "24px"}, fontFamily: {h1: ["Public Sans"], h2: ["Public Sans"], "status-tag": ["Space Grotesk"], "label-caps": ["Space Grotesk"], "body-md": ["Inter"], "body-lg": ["Inter"], "headline-md": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"]}, fontSize: {h1: ["40px", {lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "700"}], h2: ["28px", {lineHeight: "1.3", letterSpacing: "-0.01em", fontWeight: "600"}], "status-tag": ["13px", {lineHeight: "1.2", fontWeight: "500"}], "label-caps": ["12px", {lineHeight: "1", letterSpacing: "0.05em", fontWeight: "600"}], "body-md": ["14px", {lineHeight: "20px", fontWeight: "400"}], "body-lg": ["16px", {lineHeight: "24px", fontWeight: "400"}], "headline-md": ["24px", {lineHeight: "32px", fontWeight: "600"}], "label-md": ["12px", {lineHeight: "16px", fontWeight: "500"}], "headline-lg": ["32px", {lineHeight: "40px", fontWeight: "600"}]}}}};</script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-6 antialiased">
<!-- Main Container -->
<main class="w-full max-w-md flex flex-col items-center gap-section-margin z-10">
<!-- Header Section -->
<header class="flex flex-col items-center text-center gap-base">
<!-- NUST Crest Placeholder -->
<h1 class="font-h1 text-h1 text-on-surface">Welcome to S3C Portal</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in with your Qalam ID</p>
</header>
<!-- Login Form Bento Card -->
<section class="w-full bg-surface-container-lowest rounded-xl border border-outline-variant p-container-padding shadow-sm flex flex-col gap-bento-gap">
<form action="#" class="flex flex-col gap-bento-gap" method="POST">
<!-- Qalam ID Input -->
<div class="flex flex-col gap-[4px]">
<label class="font-label-caps text-label-caps text-on-surface uppercase" for="qalam-id">Qalam ID</label>
<div class="relative">
<span aria-hidden="true" class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">badge</span>
<input class="w-full pl-10 pr-3 py-3 bg-surface border border-outline-variant rounded-lg focus:border-on-surface focus:ring-0 font-body-md text-body-md text-on-surface transition-colors placeholder-on-surface-variant/50" id="qalam-id" name="qalam-id" placeholder="e.g., 345678" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-[4px]">
<label class="font-label-caps text-label-caps text-on-surface uppercase" for="password">Password</label>
<div class="relative">
<span aria-hidden="true" class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-surface border border-outline-variant rounded-lg focus:border-on-surface focus:ring-0 font-body-md text-body-md text-on-surface transition-colors placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-[-8px]">
<a class="font-label-caps text-label-caps text-primary hover:text-on-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full mt-2 py-3 px-6 rounded-lg font-h2 text-[18px] tracking-wide transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 bg-primary-container hover:bg-primary focus:ring-primary-container text-on-primary-container" type="submit">
                    Sign In
                </button>
</form>
</section>
<!-- Footer Graphic / Secondary Element -->
</main>
</body></html>
