<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Profile &amp; Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;900&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "primary-fixed-dim": "#7fd0ff",
            "tertiary-fixed-dim": "#cccd00",
            "secondary": "#5e5e5e",
            "on-error-container": "#93000a",
            "inverse-surface": "#2f3130",
            "surface-container": "#eeeeed",
            "on-primary-container": "#003950",
            "surface-container-lowest": "#ffffff",
            "secondary-fixed": "#e2e2e2",
            "on-secondary-fixed": "#1b1b1b",
            "inverse-primary": "#7fd0ff",
            "tertiary-fixed": "#e8ea1b",
            "on-tertiary-container": "#363700",
            "surface-variant": "#e2e2e2",
            "on-tertiary-fixed": "#1d1d00",
            "surface": "#f9f9f8",
            "secondary-container": "#e2e2e2",
            "on-secondary-container": "#646464",
            "on-error": "#ffffff",
            "inverse-on-surface": "#f1f1f0",
            "outline": "#6e7880",
            "on-secondary": "#ffffff",
            "primary-container": "#15a8e3",
            "on-primary-fixed": "#001e2d",
            "primary": "#00658b",
            "on-primary": "#ffffff",
            "surface-dim": "#dadad9",
            "on-tertiary-fixed-variant": "#494900",
            "surface-container-low": "#f3f4f3",
            "primary-fixed": "#c5e7ff",
            "surface-tint": "#00658b",
            "error-container": "#ffdad6",
            "outline-variant": "#bdc8d1",
            "on-secondary-fixed-variant": "#474747",
            "tertiary": "#616200",
            "surface-bright": "#f9f9f8",
            "secondary-fixed-dim": "#c6c6c6",
            "on-surface": "#1a1c1c",
            "on-surface-variant": "#3e484f",
            "on-tertiary": "#ffffff",
            "surface-container-high": "#e8e8e7",
            "error": "#ba1a1a",
            "background": "#f9f9f8",
            "surface-container-highest": "#e2e2e2",
            "on-background": "#1a1c1c",
            "tertiary-container": "#a1a300",
            "on-primary-fixed-variant": "#004c6a"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "section-margin": "48px",
            "bento-gap": "16px",
            "base": "8px",
            "container-padding": "24px"
          },
          "fontFamily": {
            "status-tag": ["Space Grotesk"],
            "h2": ["Public Sans"],
            "body-md": ["Public Sans"],
            "label-caps": ["Space Grotesk"],
            "body-lg": ["Public Sans"],
            "h1": ["Public Sans"]
          },
          "fontSize": {
            "status-tag": ["13px", {"lineHeight": "1.2", "fontWeight": "500"}],
            "h2": ["28px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
            "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
            "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
            "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
            "h1": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}]
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface-container-lowest text-on-background min-h-screen font-body-md text-body-md pt-20 pb-28">
<!-- TopAppBar -->
<header class="bg-white dark:bg-slate-950 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center px-6 h-16 w-full fixed top-0 z-50">
<div class="flex items-center gap-3">
<img alt="Profile Avatar" class="w-8 h-8 rounded-full object-cover" data-alt="A small, circular, high-resolution student profile photo showing a young adult with a friendly expression in a modern, well-lit studio setting with a clean, light-mode background." src="https://placeholder.pics/svg/300"/>
</div>
<div class="text-lg font-black tracking-widest text-sky-500 dark:text-sky-400 font-['Public_Sans'] font-bold tracking-tight">
      CAMPUS CONCIERGE
    </div>
<button class="hover:opacity-80 transition-opacity scale-95 active:duration-100 text-sky-500 dark:text-sky-400">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="max-w-4xl mx-auto px-4 md:px-6 grid grid-cols-1 md:grid-cols-12 gap-bento-gap">
<!-- Header -->
<div class="md:col-span-12 mt-4 mb-2">
<h1 class="font-h1 text-h1 text-on-background">My Profile</h1>
</div>
<!-- ID Card (Top) Bento Module -->
<section class="md:col-span-12 bg-surface-container-lowest border border-on-secondary-fixed shadow-sm rounded-xl p-container-padding flex flex-col md:flex-row gap-6 items-center md:items-start relative overflow-hidden">
<!-- Decorative background accent -->
<div class="shrink-0 relative">
<img alt="Student Photo" class="w-32 h-32 md:w-40 md:h-40 rounded-xl object-cover border border-outline-variant shadow-sm" data-alt="A clear, professional headshot portrait of a university student named Muhammad Amein. Bright, neutral lighting with a clean light-mode aesthetic. High contrast, crisp resolution." src="https://placeholder.pics/svg/300"/>
</div>
<div class="flex-1 flex flex-col items-center md:items-start text-center md:text-left gap-2 w-full md:mt-0 z-10 py-2">
<h2 class="font-h2 text-h2 text-on-background uppercase tracking-tight">Muhammad Amein</h2>
<div class="text-on-surface-variant font-label-caps text-label-caps mb-4 uppercase">
          Program: BS-AI 2A
        </div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
<div class="bg-surface-container-low border border-surface-dim rounded-lg p-3">
<div class="font-label-caps text-label-caps text-secondary mb-1">Qalam ID</div>
<div class="font-body-lg text-body-lg font-bold text-on-background">123456</div>
</div>
<div class="bg-surface-container-low border border-surface-dim rounded-lg p-3">
<div class="font-label-caps text-label-caps text-secondary mb-1">University Email</div>
<div class="font-body-md text-body-md font-bold text-on-background break-all">amein@university.edu</div>
</div>
</div>
</div>
</section>
<!-- Preferences Settings Card -->
<section class="md:col-span-12 bg-surface-container-lowest border border-on-secondary-fixed shadow-sm rounded-xl p-container-padding flex flex-col gap-6">
<div class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest border-b border-surface-dim pb-2">
        Settings
      </div>
<div class="flex flex-col gap-6">
<!-- App Theme Toggle -->
<div class="flex justify-between items-center bg-surface-container-low rounded-lg p-4 border border-transparent hover:border-surface-dim transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">palette</span>
<div>
<div class="font-body-md text-body-md font-bold text-on-background">App Theme</div>
<div class="font-body-md text-body-md text-on-surface-variant text-sm">Light Mode</div>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-dim peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container border border-on-secondary-fixed"></div>
</label>
</div>
<!-- Push Notifications Toggle -->
<div class="flex justify-between items-center bg-surface-container-low rounded-lg p-4 border border-transparent hover:border-surface-dim transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
<div>
<div class="font-body-md text-body-md font-bold text-on-background">Push Notifications</div>
<div class="font-body-md text-body-md text-on-surface-variant text-sm">Stay updated instantly</div>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-dim peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container border border-on-secondary-fixed"></div>
</label>
</div>
</div>
</section>
<!-- Action Button -->
<div class="md:col-span-12 mt-4 flex justify-center">
<button class="w-full md:w-auto px-8 py-4 bg-surface-container-lowest text-on-background font-label-caps text-label-caps uppercase tracking-widest border-2 border-on-secondary-fixed rounded-xl hover:bg-tertiary-fixed hover:text-on-tertiary-fixed transition-colors shadow-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">logout</span>
        Log Out
      </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 h-20 pb-safe bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 shadow-[0_-4px_20px_0_rgba(0,0,0,0.05)] md:hidden">
<!-- Chat -->
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-1 hover:text-sky-600 dark:hover:text-sky-300">
<span class="material-symbols-outlined text-2xl mb-1">chat_bubble</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Chat</span>
</button>
<!-- Inbox -->
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-1 hover:text-sky-600 dark:hover:text-sky-300">
<span class="material-symbols-outlined text-2xl mb-1">notifications</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Inbox</span>
</button>
<!-- Profile (Active) -->
<button class="flex flex-col items-center justify-center text-sky-500 dark:text-sky-400 bg-sky-50 dark:bg-sky-900/30 rounded-xl px-4 py-1 hover:text-sky-600 dark:hover:text-sky-300 scale-90 transition-transform">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">account_circle</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Profile</span>
</button>
</nav>
</body></html>
