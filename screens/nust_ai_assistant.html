<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NUST AI Assistant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {"surface-dim": "#d7dae3", surface: "#f9f9ff", "secondary-container": "#b6d0ff", "surface-container-lowest": "#ffffff", "surface-container-high": "#e6e8f1", "on-tertiary-container": "#0d0300", "inverse-primary": "#aac7ff", "surface-tint": "#005db8", "primary-fixed": "#d6e3ff", "on-tertiary-fixed": "#321200", "on-secondary-container": "#3f5881", "on-primary-fixed-variant": "#00458d", "on-tertiary-fixed-variant": "#763400", "on-secondary-fixed": "#001b3d", "inverse-on-surface": "#eef0fa", "tertiary-container": "#c05900", "on-secondary": "#ffffff", "on-surface": "#181c22", "on-primary": "#ffffff", primary: "#005cb8", "inverse-surface": "#2d3037", background: "#f9f9ff", "error-container": "#ffdad6", "surface-bright": "#f9f9ff", "tertiary-fixed": "#ffdbc9", "outline-variant": "#c1c6d5", "on-secondary-fixed-variant": "#2d476f", "tertiary-fixed-dim": "#ffb68c", "secondary-fixed-dim": "#aec7f7", error: "#ba1a1a", "on-error-container": "#93000a", "surface-container-low": "#f1f3fc", "on-primary-fixed": "#001b3e", "primary-container": "#1275e2", "surface-variant": "#e0e2eb", "on-error": "#ffffff", secondary: "#465f88", "surface-container-highest": "#e0e2eb", "secondary-fixed": "#d6e3ff", "on-tertiary": "#ffffff", "surface-container": "#ebedf7", outline: "#717785", "primary-fixed-dim": "#aac7ff", "on-primary-container": "#000512", "on-surface-variant": "#414753", "on-background": "#181c22", tertiary: "#9a4600"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}, spacing: {"section-margin": "48px", "container-padding": "24px", "bento-gap": "16px", base: "8px", md: "16px", lg: "24px", xl: "32px", xs: "4px", sm: "8px", gutter: "16px", margin: "24px"}, fontFamily: {"status-tag": ["Space Grotesk"], "label-caps": ["Space Grotesk"], "body-md": ["Inter"], "body-lg": ["Inter"], h2: ["Public Sans"], h1: ["Public Sans"], "headline-md": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"]}, fontSize: {"status-tag": ["13px", {lineHeight: "1.2", fontWeight: "500"}], "label-caps": ["12px", {lineHeight: "1", letterSpacing: "0.05em", fontWeight: "600"}], "body-md": ["14px", {lineHeight: "20px", fontWeight: "400"}], "body-lg": ["16px", {lineHeight: "24px", fontWeight: "400"}], h2: ["28px", {lineHeight: "1.3", letterSpacing: "-0.01em", fontWeight: "600"}], h1: ["40px", {lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "700"}], "headline-md": ["24px", {lineHeight: "32px", fontWeight: "600"}], "label-md": ["12px", {lineHeight: "16px", fontWeight: "500"}], "headline-lg": ["32px", {lineHeight: "40px", fontWeight: "600"}]}}}};</script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-on-background">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-surface-container-lowest border-b border-surface-variant shadow-sm transition-all duration-200 ease-in-out">
<button class="flex items-center justify-center text-on-surface hover:bg-surface-container-low rounded-full p-2 transition-all duration-200 active:scale-95">
<span class="material-symbols-outlined" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-h2 text-h2 text-on-surface flex-1 text-center truncate">NUST AI Assistant</h1>
<button class="flex items-center justify-center text-on-surface hover:bg-surface-container-low rounded-full p-2 transition-all duration-200 active:scale-95">
<span class="material-symbols-outlined" data-icon="more_vert" style="font-variation-settings: 'FILL' 0;">more_vert</span>
</button>
</header>
<!-- Chat Canvas -->
<main class="flex-1 flex flex-col overflow-y-auto pt-16 pb-32 px-container-padding space-y-bento-gap bg-background">
<!-- Welcome Image -->
<!-- AI Message -->
<div class="flex items-end space-x-2 w-full max-w-2xl">
<div class="flex-shrink-0 w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[20px]" data-icon="smart_toy" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
</div>
<div class="bg-surface-container-low border border-surface-variant text-on-surface rounded-2xl rounded-bl-sm p-4 shadow-sm relative">
<p class="font-body-md text-body-md">Hi! I am your AI assistant. I can help route complaints or answer policy questions. What do you need help with?</p>
</div>
</div>
<!-- User Message -->
<div class="flex items-end justify-end space-x-2 w-full max-w-2xl self-end mt-4">
<div class="bg-primary text-on-primary rounded-2xl rounded-br-sm p-4 shadow-sm relative">
<p class="font-body-md text-body-md">The AC in room 402 is leaking.</p>
</div>
<div class="flex-shrink-0 w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
</div>
</main>
<!-- Bottom Input Area (Sticky) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-surface-variant p-4 z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<!-- Quick Action Chips -->
<div class="flex overflow-x-auto space-x-2 pb-3 mb-2 scrollbar-hide">
<button class="flex-shrink-0 font-status-tag text-status-tag bg-surface-container-low border border-outline-variant text-on-surface px-4 py-2 rounded-full hover:bg-tertiary-container hover:text-on-tertiary-container transition-colors duration-200 whitespace-nowrap shadow-sm">
                Report an issue
            </button>
<button class="flex-shrink-0 font-status-tag text-status-tag bg-surface-container-low border border-outline-variant text-on-surface px-4 py-2 rounded-full hover:bg-tertiary-container hover:text-on-tertiary-container transition-colors duration-200 whitespace-nowrap shadow-sm">
                Check cafeteria menu
            </button>
<button class="flex-shrink-0 font-status-tag text-status-tag bg-surface-container-low border border-outline-variant text-on-surface px-4 py-2 rounded-full hover:bg-tertiary-container hover:text-on-tertiary-container transition-colors duration-200 whitespace-nowrap shadow-sm">
                Academic calendar
            </button>
</div>
<!-- Input Field -->
<div class="flex items-center space-x-2">
<div class="flex-1 relative flex items-center bg-surface-container-low border border-outline-variant rounded-full focus-within:border-on-surface focus-within:ring-1 focus-within:ring-on-surface transition-all duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface py-3 pl-4 pr-10 rounded-full" placeholder="Type your message..." type="text"/>
<button class="absolute right-2 text-on-surface-variant hover:text-primary transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="mic" style="font-variation-settings: 'FILL' 0;">mic</span>
</button>
</div>
<button class="flex-shrink-0 bg-primary-container text-on-primary w-12 h-12 rounded-full flex items-center justify-center shadow-sm hover:bg-primary transition-colors duration-200 active:scale-95">
<span class="material-symbols-outlined" data-icon="send" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
</body></html>
