<body class="bg-surface-container-low text-on-surface font-body-md antialiased min-h-screen flex flex-col pb-safe pt-16">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-surface-container-lowest border-b border-surface-container shadow-sm">
<button class="text-on-surface hover:bg-surface-container transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="text-h2 font-h2 flex-1 text-center pr-8">New Request</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-4xl mx-auto px-4 py-6 md:px-8 space-y-bento-gap flex flex-col">
<!-- Banner Image -->
<div class="w-full rounded-xl overflow-hidden mb-4">
<img alt="Header Image" class="w-full h-auto object-cover object-center aspect-[2.89]" src="https://lh3.googleusercontent.com/aida/ADBb0ugZK2IF_i9UxIOF_Z_-uUeFJGa4q0xQ-CY4EKbMA2eyixPGYIc414IdSIBcYFZf7b6DUPlgR500Do1V1XJp2QKnsuPkUOK0pEHHzRQcCvPfsMF-VBsyyAQlxx1OSXrA0THSBhK7T9l28Dp-dSMIEO5Ad8ZGXSuq7Ji0OjQ2RkmS_tIRHT9EuyFMx1717dUgrEmuSux8XfHmX8dK_zT0wurKnYaxAUkuOJiwSgqfxvCfCtjwkEltXlaaLZAsyFONBBnm21DxTjl4Dzw"/>
</div>
<!-- Section 1: Classification Bento -->
<section class="bg-surface-container-lowest rounded-xl p-container-padding border border-surface-dim shadow-sm flex flex-col gap-6">
<!-- Category Chips -->
<div class="space-y-3">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">CATEGORY</h2>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border border-surface-dim bg-surface-container-lowest text-on-surface hover:bg-surface-container transition-colors text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-primary-container">
                        Hostel
                    </button>
<button class="px-4 py-2 rounded-full border border-surface-dim bg-surface-container-lowest text-on-surface hover:bg-surface-container transition-colors text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-primary-container">
                        IT Support
                    </button>
<button class="px-4 py-2 rounded-full border border-primary-container bg-primary-fixed text-on-primary-fixed-variant hover:bg-primary-fixed-dim transition-colors text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-primary-container">
                        Academics
                    </button>
<button class="px-4 py-2 rounded-full border border-surface-dim bg-surface-container-lowest text-on-surface hover:bg-surface-container transition-colors text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-primary-container">
                        Other
                    </button>
</div>
</div>
<!-- Urgency Segmented Control -->
<div class="space-y-3">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">URGENCY</h2>
<div class="flex rounded-lg border border-surface-dim overflow-hidden w-full max-w-md bg-surface-container-lowest">
<button class="flex-1 py-2 text-center text-sm font-semibold text-on-surface hover:bg-surface-container transition-colors focus:outline-none">
                        Low
                    </button>
<div class="w-px bg-surface-dim"></div>
<button class="flex-1 py-2 text-center text-sm font-semibold transition-colors focus:outline-none" style="background-color: #FFFFE0; color: #1a1c1c;">
                        Medium
                    </button>
<div class="w-px bg-surface-dim"></div>
<button class="flex-1 py-2 text-center text-sm font-semibold text-on-surface hover:bg-surface-container transition-colors focus:outline-none">
                        High
                    </button>
</div>
</div>
</section>
<!-- Section 2: Details Bento -->
<section class="bg-surface-container-lowest rounded-xl p-container-padding border border-surface-dim shadow-sm flex flex-col gap-6">
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="issue-title">ISSUE TITLE</label>
<input class="w-full bg-surface-container-low border border-surface-dim rounded-lg px-4 py-3 text-on-surface placeholder:text-outline focus:border-on-surface focus:ring-0 transition-colors" id="issue-title" placeholder="e.g., AC Leaking in Room 402" type="text"/>
</div>
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="description">DESCRIPTION</label>
<textarea class="w-full bg-surface-container-low border border-surface-dim rounded-lg px-4 py-3 text-on-surface placeholder:text-outline focus:border-on-surface focus:ring-0 transition-colors resize-y" id="description" placeholder="Tell us what's happening..." rows="4"></textarea>
</div>
</section>
<!-- Section 3: Attachment Bento -->
<section class="bg-surface-container-lowest rounded-xl p-container-padding border border-surface-dim shadow-sm flex flex-col items-center justify-center py-8">
<button class="w-full flex flex-col items-center justify-center gap-3 p-6 border-2 border-dashed border-outline-variant rounded-xl hover:bg-surface-container-low hover:border-outline transition-all group">
<span class="material-symbols-outlined text-4xl text-outline group-hover:text-primary-container transition-colors" style="font-variation-settings: 'FILL' 0;">photo_camera</span>

<!-- Spacer for sticky button -->
<div class="h-24"></div>

<!-- Sticky Bottom Action -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-surface-container-lowest/90 backdrop-blur-md border-t border-surface-dim z-40 md:static md:bg-transparent md:border-none md:p-0 md:mt-8 md:mb-8 md:max-w-4xl md:mx-auto">
<button class="w-full bg-[#F88379] hover:bg-[#e87066] text-white py-4 rounded-xl font-bold text-lg transition-colors shadow-sm active:scale-[0.98] duration-150">
            Submit Request
        </button>
</div>
